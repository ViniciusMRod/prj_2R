<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PCMSO Alert System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }
        .sidebar { min-height: 100vh; background: #2c3e50; }
        .sidebar .nav-link { color: #bdc3c7; padding: 10px 20px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,0.1); border-radius: 4px; }
        .sidebar .nav-link i { margin-right: 8px; }
        .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .badge-pendente { background-color: #f39c12; }
        .badge-aprovado { background-color: #27ae60; }
        .badge-rejeitado { background-color: #e74c3c; }
        .table th { background-color: #34495e; color: white; }
        .btn-aprovar { background-color: #27ae60; color: white; }
        .btn-rejeitar { background-color: #e74c3c; color: white; }
        .validation-ok { color: #27ae60; }
        .validation-warn { color: #f39c12; }
        .validation-error { color: #e74c3c; }
        .pcmso-header { background: linear-gradient(135deg, #2c3e50, #3498db); color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark" style="background-color:#2c3e50;">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-shield-check me-2"></i>PCMSO Alert System
            </a>
            <div class="d-flex">
                <a href="/validacao" class="btn btn-outline-light btn-sm me-2">
                    <i class="bi bi-clipboard-check"></i> Validações
                </a>
                <a href="/demandas/" class="btn btn-outline-light btn-sm me-2">
                    <i class="bi bi-people"></i> Demandas
                </a>
                <a href="/colaboradores/" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-person-lines-fill"></i> Colaboradores
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        {% if mensagem_sucesso %}
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-2"></i>{{ mensagem_sucesso }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}
        {% if mensagem_erro %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i>{{ mensagem_erro }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
